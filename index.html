<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>会议转录</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M7 0h9v32H7A7 7 0 0 1 0 25V7a7 7 0 0 1 7-7z' fill='%23e2a45f'/%3E%3Cpath d='M16 0h9a7 7 0 0 1 7 7v18a7 7 0 0 1-7 7h-9z' fill='%23e9e4d9'/%3E%3C/svg%3E">
<style>
:root{color-scheme:dark;--ink:#e9e4d9;--ink-dim:#a39f96;--ink-faint:#8c887f;--ground:#101316;--raised:#171c21;--line:#30363b;--lamp:#e2a45f;--danger:#d9534b;--danger-ink:#ef8b82;--body:19px;--lh:1.85;--spk1:#8db4d4;--spk2:#c8a56a;--serif:"Iowan Old Style","Songti SC",serif;--mono:ui-monospace,"SF Mono",Menlo,monospace}
*{box-sizing:border-box}html,body{height:100%}body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--serif);display:flex;flex-direction:column;overflow:hidden;-webkit-font-smoothing:antialiased}button{font:inherit;color:inherit;cursor:pointer}button:focus-visible{outline:2px solid var(--lamp);outline-offset:3px}button:disabled{opacity:.35;cursor:not-allowed}button[hidden]{display:none}
header{flex:none;background:var(--raised);border-bottom:1px solid var(--line);padding:10px 28px 0;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}.top{display:flex;align-items:center;gap:32px;min-height:72px}.brand{font:600 19px var(--serif);white-space:nowrap}.b1{color:var(--lamp)}.inputs{display:grid;gap:0;min-width:270px;max-width:480px;flex:1}.input-row{display:grid;grid-template-columns:82px minmax(0,1fr) 44px;gap:10px;align-items:center;min-height:34px}.input-row>label{font-size:12px;white-space:nowrap}.input-row small{font-size:10px;color:var(--ink-dim);margin-left:5px}.input-status{font-size:11px;color:var(--ink-dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.actions{display:flex;gap:8px;align-items:center;margin-left:auto}.state{display:grid;gap:5px;margin-right:12px;font:11px var(--mono);color:var(--ink-dim);text-align:right;max-width:260px}#clock{font-size:17px;color:var(--ink);font-variant-numeric:tabular-nums}#stateText{line-height:1.4}body.rec #clock{color:var(--lamp)}.tbtn,#record{border:1px solid var(--line);border-radius:6px;background:transparent;font-size:12px;padding:0 12px;min-height:36px;white-space:nowrap}.tbtn:hover:not(:disabled){background:#252b31;color:var(--ink)}#record{color:var(--lamp);border-color:#725432;background:#32291e;min-width:84px}.dot{display:inline-block;width:6px;height:6px;background:currentColor;border-radius:50%;margin-right:7px}body.rec #record{background:#542b2a;color:#ffd5d0;border-color:#824641}body.rec .dot{border-radius:1px}#clearWrap{position:relative;width:88px;flex:none}#clearWrap>.tbtn{width:100%}#clearWrap .cancel{position:absolute;top:42px;left:0;z-index:5;background:var(--raised);box-shadow:0 8px 22px #0008}#clearYes{color:var(--danger-ink);border-color:var(--danger-ink)}
.preferences{display:flex;align-items:center;flex-wrap:wrap;gap:4px 24px;border-top:1px solid var(--line);margin-top:7px;padding:3px 0;font-size:11px;color:var(--ink-dim)}.pref{display:flex;align-items:center;gap:9px;min-height:36px}.val{font:11px var(--mono);min-width:38px;text-align:center;color:var(--ink)}.step{display:flex;gap:2px}.step button{background:transparent;border:0;width:30px;height:32px;border-radius:4px;font-size:16px;color:var(--ink-dim)}.step button:hover{background:#252b31;color:var(--ink)}.switch{border:0;background:transparent;position:relative;width:44px;height:34px;flex:none;padding:0}.switch:before{content:"";position:absolute;width:32px;height:18px;border-radius:12px;background:#45505a;top:8px;left:6px}.switch:after{content:"";position:absolute;width:12px;height:12px;top:11px;left:9px;border-radius:50%;background:#d6dce1;transition:transform .15s}.switch[aria-checked=true]:before{background:#736043}.switch[aria-checked=true]:after{transform:translateX(14px);background:#ffe0b5}.seg{display:flex;gap:2px}.seg button{border:0;border-radius:4px;background:transparent;color:var(--ink-dim);font:11px var(--mono);min-height:32px;padding:0 12px}.seg button[aria-pressed=true]{color:var(--lamp);background:#332b22}.seg button:hover{color:var(--ink)}.seg button[data-off=true]{opacity:.45}.seg button:disabled{opacity:.35}.hint{font-size:10px;margin-left:auto}
#stage{flex:1 1 auto;min-height:0;overflow-y:auto;overscroll-behavior:contain;position:relative;display:flex;flex-direction:column;scrollbar-width:thin;scrollbar-color:#343a40 transparent}#paper{margin:auto auto 0;width:100%;padding:36px 32px 52px}#paper p{display:flex;flex-direction:column;align-items:center;width:fit-content;max-width:min(560px,100%);margin:0 auto 6px;padding:7px 12px 8px;border:1px solid #ffffff09;border-radius:9px;background:#171d23;font-size:var(--body);line-height:var(--lh);letter-spacing:.012em}#paper p:nth-child(even){background:#1d2125}#paper p.medium{max-width:min(820px,100%)}#paper p.large{max-width:min(1080px,100%)}#paper p.draft{opacity:.7;border-style:dashed}
#paper .meta{display:flex;align-items:baseline;gap:.8em;margin-bottom:3px;white-space:nowrap}#paper .meta>*{font: .6em var(--mono);line-height:1}#paper time{color:var(--ink-dim)}#paper .spk{color:var(--spk,var(--ink-dim));display:none}body.diar #paper .spk{display:block}#paper .text{display:block;width:fit-content;max-width:100%;min-width:0;text-align:left;overflow-wrap:anywhere}#paper [data-spk="0"]{--spk:var(--spk1)}#paper [data-spk="1"]{--spk:var(--spk2)}body.colorspk #paper .text{color:var(--spk)}.caret{display:inline-block;width:2px;height:1em;margin-left:3px;vertical-align:-.16em;background:var(--lamp);animation:blink 1.1s step-end infinite}@keyframes blink{50%{opacity:0}}#empty{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:24px;text-align:center;color:var(--ink-faint);pointer-events:none}#empty p{font-size:19px;margin:0 0 10px}#empty small{font:11px var(--mono)}#audioMeters{flex:none;display:flex;justify-content:center;gap:24px;padding:10px 18px calc(10px + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:var(--raised);font:12px var(--mono)}.audio-meter{display:grid;grid-template-columns:48px minmax(40px,180px) 88px;gap:8px;align-items:center;min-width:0;color:var(--ink-dim);--meter-color:var(--spk1)}.audio-meter[data-channel=remote]{--meter-color:var(--lamp)}.meter-track{height:14px;background:#30363b;overflow:hidden;border-radius:3px;position:relative}.meter-track i{display:block;height:100%;background:var(--meter-color);transform:scaleX(0);transform-origin:left;transition:transform 80ms linear}.meter-track:after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(to right,transparent 0,transparent calc(10% - 2px),var(--raised) calc(10% - 2px),var(--raised) 10%)}.audio-meter output{text-align:right;font-size:11px;font-variant-numeric:tabular-nums}@media(max-width:650px){#audioMeters{display:grid;gap:8px}.audio-meter{grid-template-columns:48px minmax(80px,240px) 88px}}#jump,#toast{position:fixed;left:50%;bottom:90px;transform:translate(-50%,10px);font:12px var(--mono);background:var(--raised);border:1px solid var(--line);border-radius:12px;padding:10px 16px;color:var(--ink-dim);opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;max-width:min(600px,90vw)}#jump.show,#toast.show{opacity:1;transform:translate(-50%,0)}#jump.show{pointer-events:auto}#toast{color:var(--ink);z-index:10;line-height:1.6}#toast.bad{color:var(--danger-ink)}
@media(max-width:1000px){header{padding:8px 18px 0}.top{gap:18px;flex-wrap:wrap}.brand{margin-right:auto}.inputs{order:3;flex-basis:100%;max-width:none;grid-template-columns:1fr;min-width:0}.actions{margin-left:0}.state{max-width:160px}.preferences{gap:2px 16px}.hint{display:none}}
@media(max-width:540px){header{padding:8px 12px 0}.top{gap:8px}.state{order:4;display:flex;justify-content:flex-end;align-items:center;flex-basis:100%;max-width:none;margin:2px 0 0;gap:10px}.actions{gap:5px;flex-wrap:wrap;justify-content:flex-end;max-width:235px}.brand{font-size:17px}.tbtn,#record{padding:0 8px}#clearWrap{width:78px}#record{min-width:68px}.input-row{grid-template-columns:82px minmax(0,1fr) 44px}#paper{padding:28px 18px 40px}.preferences{gap:0 14px}}
@media(pointer:coarse){.switch{height:44px}.switch:before{top:13px}.switch:after{top:16px}.step button,.seg button,.tbtn,#record{min-height:44px}.step button{width:44px}.input-row{min-height:44px}#clearWrap .cancel{top:50px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
/* 本地历史：独立查看，不替换实时字幕 */
#historyDialog{width:min(880px,94vw);max-height:86vh;padding:0;border:1px solid var(--line);border-radius:12px;background:var(--ground);color:var(--ink);box-shadow:0 20px 80px #0008;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}#historyDialog{scrollbar-width:thin;scrollbar-color:#59616a transparent}#historyDialog::-webkit-scrollbar,#stage::-webkit-scrollbar{width:7px}#historyDialog::-webkit-scrollbar-track,#stage::-webkit-scrollbar-track{background:transparent}#historyDialog::-webkit-scrollbar-thumb,#stage::-webkit-scrollbar-thumb{background:#454d55;border:2px solid var(--ground);border-radius:10px}#historyDialog::-webkit-scrollbar-thumb:hover,#stage::-webkit-scrollbar-thumb:hover{background:#747d86}#historyDialog::backdrop{background:#0009}.history-head{display:flex;align-items:center;gap:12px;padding:12px 18px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--raised);z-index:1}.history-head h2{font-size:15px;margin:0;flex:1}.history-head button,.history-item button{min-height:40px}.history-body{padding:8px 14px 14px}.history-note{font-size:12px;color:var(--ink-dim);line-height:1.7}.history-item{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}.history-item>div{flex:1}.history-item h3{font-size:14px;font-weight:500;margin:0 0 7px}.history-item p{font-size:12px;color:var(--ink-dim);margin:0;line-height:1.7}.history-segment{margin:6px 0;padding:7px 12px 8px;border-radius:7px;background:#171d23}.history-segment:nth-child(even){background:#1d2125}.history-segment small{font:12px var(--mono);color:var(--ink-dim)}.history-segment p{font:var(--body)/var(--lh) var(--serif);overflow-wrap:anywhere;margin:3px 0 0}.history-tools{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}.history-delete-wrap{position:relative;margin-left:auto;width:112px}.history-delete-wrap>button{width:100%;min-height:40px}#historyDelete{color:var(--danger-ink)}#historyDeleteCancel{position:absolute;top:44px;left:0;z-index:2;background:var(--raised);box-shadow:0 6px 20px #0008}#historyDelete[data-armed=true]{border-color:var(--danger-ink)}.history-item button{flex:none}#historyDialog [hidden]{display:none}
@media(max-width:540px){.history-item{align-items:flex-start;flex-direction:column}.history-head{padding:10px}.history-head h2{font-size:13px}.history-body{padding:12px}.actions{max-width:none}.top{align-items:center}}
</style>
</head>
<body>
<header>
<div class="top">
<span class="brand" aria-label="会议转录"><span class="b1">会议</span><span>转录</span></span>
<div class="inputs" aria-label="音频输入">
<div class="input-row"><label for="micInput">麦克风<small>我</small></label><span class="input-status" id="micStatus">已开启</span><button id="micInput" class="switch" role="switch" aria-checked="true" aria-label="麦克风输入"></button></div>
<div class="input-row"><label for="appInput">应用声音<small>对方</small></label><span class="input-status" id="appStatus">已关闭</span><button id="appInput" class="switch" role="switch" aria-checked="false" aria-label="应用声音输入"></button></div>
</div>
<div class="actions"><div class="state"><span id="clock">00:00</span><span id="stateText" role="status">待机</span></div><button id="historyBtn" class="tbtn">查看历史转录</button><button id="copy" class="tbtn" disabled>复制</button><div id="clearWrap"></div><button id="record"><span class="dot"></span>开始</button></div>
</div>
<div class="preferences" aria-label="显示与转写偏好">
<div class="pref"><span>字号</span><span class="val" id="fontVal">19 px</span><span class="step"><button id="smaller" aria-label="缩小字号">−</button><button id="larger" aria-label="放大字号">+</button></span></div>
<div class="pref"><span>行距</span><span class="val" id="lineVal">1.85</span><span class="step"><button id="tighter" aria-label="收紧行距">−</button><button id="looser" aria-label="放宽行距">+</button></span></div>
<div class="pref"><label for="colorSpk">字幕渲染</label><button id="colorSpk" class="switch" role="switch" aria-checked="false" aria-label="字幕渲染：按人物给正文着色"></button></div>
<div class="pref"><span>引擎</span><span class="seg" role="group" aria-label="转写引擎"><button data-engine="local" aria-pressed="true" title="本机 LazyTyper：音频不出网，停顿后整段出字">本地</button><button data-engine="bailian" aria-pressed="false" title="阿里云百炼：音频上传到 dashscope.aliyuncs.com，边说边出字">百炼</button></span></div>
<div class="pref"><span>语言</span><span class="seg" role="group" aria-label="语言提示"><button data-lang="" aria-pressed="true">自动</button><button data-lang="zh" aria-pressed="false">中文</button><button data-lang="en" aria-pressed="false">EN</button></span></div>
<span class="hint" title="浏览器共享框若写的是系统音频，可能包含其他应用的声音">双路采集建议戴耳机 · 应用音频范围取决于浏览器授权</span>
</div>
</header>
<div id="stage"><div id="paper"></div><div id="empty"><p>按「开始」，说第一句话。</p><small>两路可独立开关，字幕按输入来源区分</small></div></div>
<footer id="audioMeters" aria-label="实时输入音量，仅录音时显示电平">
<div class="audio-meter" data-channel="mic"><span>麦克风</span><div class="meter-track" role="meter" aria-label="麦克风输入音量" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><i></i></div><output>待机</output></div>
<div class="audio-meter" data-channel="remote"><span>应用</span><div class="meter-track" role="meter" aria-label="应用输入音量" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><i></i></div><output>待机</output></div>
</footer><button id="jump">回到最新</button><div id="toast" role="status"></div>
<dialog id="historyDialog" aria-labelledby="historyTitle">
<div class="history-head"><button id="historyBack" class="tbtn" hidden>返回列表</button><h2 id="historyTitle">历史转录</h2><button id="historyRefresh" class="tbtn">刷新</button><button id="historyClose" class="tbtn" aria-label="关闭历史转录">关闭</button></div>
<div class="history-body"><p id="historyMessage" class="history-note" role="status"></p><div id="historyList"></div><section id="historyDetail" hidden><div class="history-tools"><button id="historyCopy" class="tbtn">复制全文</button><button id="historyExport" class="tbtn">保存为 TXT</button><span class="history-delete-wrap"><button id="historyDelete" class="tbtn" aria-expanded="false" aria-controls="historyDeleteCancel">删除记录</button><button id="historyDeleteCancel" class="tbtn" hidden>取消</button></span></div><div id="historyContent"></div></section></div>
</dialog>
<script src="/history.js"></script>
<script src="/app.js"></script>
</body></html>
